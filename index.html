<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>척추 척척추 샘플러</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body { background-color: #050505; color: #E0E0E0; font-family: monospace; overflow: hidden; }
        canvas { transform: scaleX(-1); } /* 카메라 좌우 반전 */
        .status-panel { border: 1px solid #222; background: #0F0F0F; }
    </style>
</head>
<body>

    <div class="flex flex-col h-screen p-4">
        <header class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
            <h1 class="text-xl font-black uppercase tracking-tighter">Spine Sampler <span class="text-xs font-normal text-zinc-500">v1.0</span></h1>
            <button id="startBtn" class="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded transition-all">ENGINE INIT</button>
        </header>

        <div class="flex-1 grid grid-cols-4 gap-4 min-h-0">
            <div id="leftPad" class="status-panel rounded p-4 flex flex-col justify-center items-center transition-all">
                <span class="text-xs text-zinc-500 mb-2">LEFT HAND</span>
                <h2 class="text-4xl font-black text-cyan-400">CHUCK</h2>
            </div>

            <div class="col-span-2 relative bg-black rounded border border-zinc-800 overflow-hidden">
                <video id="input_video" class="hidden"></video>
                <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>
                <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/80 text-cyan-400 font-bold">카메라 로딩 중...</div>
            </div>

            <div id="rightPad" class="status-panel rounded p-4 flex flex-col justify-center items-center transition-all">
                <span class="text-xs text-zinc-500 mb-2">RIGHT HAND</span>
                <h2 class="text-4xl font-black text-pink-500">CHU</h2>
            </div>
        </div>

        <footer class="mt-4 text-[10px] text-zinc-600 flex justify-between uppercase font-bold">
            <span>Status: <span id="statusText" class="text-zinc-400">Standby</span></span>
            <span>MediaPipe Hands Accelerated</span>
        </footer>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        
        let audioCtx = null;
        let samples = {};
        let isArmed = { Left: false, Right: false };
        const THRESHOLD = 0.3; // 트리거 라인 높이 (상단 30%)

        // 오디오 파일 로드 함수
        async function loadSample(url) {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        function playSound(side) {
            if (!audioCtx || !samples[side]) return;
            const source = audioCtx.createBufferSource();
            source.buffer = samples[side];
            source.connect(audioCtx.destination);
            source.start(0);

            // 시각 효과
            const pad = document.getElementById(side === 'Left' ? 'leftPad' : 'rightPad');
            pad.style.backgroundColor = side === 'Left' ? '#003344' : '#440022';
            setTimeout(() => pad.style.backgroundColor = '#0F0F0F', 100);
        }

        function onResults(results) {
            document.getElementById('loadingOverlay').style.display = 'none';
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandedness) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    // ★ 좌우 반전 해결 핵심: 카메라 거울 모드에 맞춰 Left와 Right 인식을 반대로 뒤집어줍니다. 
                    const rawSide = results.multiHandedness[index].label; 
                    const side = rawSide === 'Left' ? 'Right' : 'Left'; 

                    const indexTip = landmarks[8]; // 검지 손가락 끝 

                    // 트리거 로직: 검지가 라인 위로 올라갔다 내려올 때 [cite: 135]
                    if (indexTip.y < THRESHOLD) {
                        isArmed[side] = true;
                    } else if (indexTip.y > THRESHOLD + 0.05 && isArmed[side]) {
                        playSound(side);
                        isArmed[side] = false;
                    }

                    // 손가락 시각화: 이제 올바르게 매칭된 side 변수를 사용하여 화면의 색상도 정상적으로 맞춰집니다.
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: side === 'Left' ? '#00F0FF' : '#FF007A', lineWidth: 1, radius: 3});
                });
            }

            // 기준선 그리기
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvasElement.height * THRESHOLD);
            canvasCtx.lineTo(canvasElement.width, canvasElement.height * THRESHOLD);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            canvasCtx.setLineDash([5, 5]);
            canvasCtx.stroke();
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        startBtn.onclick = async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('statusText').innerText = 'Loading Samples...';
                try {
                    // 음원 파일 매칭 유지
                    samples['Left'] = await loadSample('chuck.mp3');
                    samples['Right'] = await loadSample('chu.mp3');
                    document.getElementById('statusText').innerText = 'Engine Active';
                    startBtn.innerText = 'RUNNING';
                    startBtn.style.opacity = '0.5';
                    camera.start();
                } catch (e) {
                    alert('음원 파일을 찾을 수 없습니다. chuck.mp3와 chu.mp3 파일이 같은 폴더에 있는지 확인하세요.');
                    console.error(e);
                }
            }
        };

        // 캔버스 크기 조절
        canvasElement.width = 1280;
        canvasElement.height = 720;
    </script>
</body>
</html>
        // 캔버스 크기 조절
        canvasElement.width = 1280;
        canvasElement.height = 720;
    </script>
</body>
</html>
