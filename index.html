<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>척추 척척추 샘플러</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body { background-color: #050505; color: #E0E0E0; font-family: monospace; overflow: hidden; }
        canvas { transform: scaleX(-1); } /* 카메라 좌우 반전 */
        .status-panel { border: 1px solid #222; background: #0F0F0F; }
    </style>
</head>
<body>

    <div class="flex flex-col h-screen p-4">
        <header class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
            <h1 class="text-xl font-black uppercase tracking-tighter">Spine Sampler <span class="text-xs font-normal text-zinc-500">v2.1</span></h1>
            <button id="startBtn" class="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded transition-all">ENGINE INIT</button>
        </header>

        <div class="flex-1 grid grid-cols-5 gap-4 min-h-0">
            <div id="leftPad" class="status-panel rounded p-4 flex flex-col justify-center items-center transition-all">
                <span class="text-[10px] text-zinc-500 mb-2 tracking-wider">LEFT HAND</span>
                <h2 class="text-3xl font-black text-cyan-400">CHUCK</h2>
            </div>

            <div class="col-span-3 relative bg-black rounded border border-zinc-800 overflow-hidden">
                <video id="input_video" class="hidden"></video>
                <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>
                <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/80 text-cyan-400 font-bold">카메라 로딩 중...</div>
            </div>

            <div id="rightPad" class="status-panel rounded p-4 flex flex-col justify-center items-center transition-all">
                <span class="text-[10px] text-zinc-500 mb-2 tracking-wider">RIGHT HAND</span>
                <h2 class="text-3xl font-black text-pink-500">CHU</h2>
            </div>
        </div>

        <footer class="mt-4 text-[10px] text-zinc-600 flex justify-between uppercase font-bold">
            <span>Status: <span id="statusText" class="text-zinc-400">Standby</span></span>
            <span>MediaPipe Hands Accelerated</span>
        </footer>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        
        let audioCtx = null;
        let samples = {};
        let isArmed = { Left: false, Right: false };

        async function loadSample(url) {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        function playSound(side) {
            if (!audioCtx || !samples[side]) return;
            const source = audioCtx.createBufferSource();
            source.buffer = samples[side];
            source.connect(audioCtx.destination);
            source.start(0);

            const pad = document.getElementById(side === 'Left' ? 'leftPad' : 'rightPad');
            pad.style.backgroundColor = side === 'Left' ? '#003344' : '#440022';
            setTimeout(() => pad.style.backgroundColor = '#0F0F0F', 100);
        }

        function onResults(results) {
            document.getElementById('loadingOverlay').style.display = 'none';
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandedness) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const rawSide = results.multiHandedness[index].label; 
                    const side = rawSide === 'Left' ? 'Right' : 'Left'; 

                    const wrist = landmarks[0];        // 0번: 손목
                    const middleTip = landmarks[12];   // 12번: 중지 끝

                    // 두 점 사이의 유클리디안 거리를 구합니다.
                    const distance = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);

                    // ★ 변경 포인트: 동작 반전 및 민감도(수치) 최적화
                    // 1. 손을 적당히 폈을 때 (거리가 0.22 이상 -> 장전!)
                    if (distance > 0.22) {
                        isArmed[side] = true;
                    } 
                    // 2. 손을 오므렸을 때 (거리가 0.19 이하로 짧아짐 -> 사운드 발사!)
                    else if (distance < 0.19 && isArmed[side]) {
                        playSound(side);
                        isArmed[side] = false;
                    }

                    // 손가락 시각화
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: side === 'Left' ? '#00F0FF' : '#FF007A', lineWidth: 1, radius: 3});
                });
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        startBtn.onclick = async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('statusText').innerText = 'Loading Samples...';
                try {
                    samples['Left'] = await loadSample('chuck.mp3');
                    samples['Right'] = await loadSample('chu.mp3');
                    document.getElementById('statusText').innerText = 'Engine Active';
                    startBtn.innerText = 'RUNNING';
                    startBtn.style.opacity = '0.5';
                    camera.start();
                } catch (e) {
                    alert('음원 파일을 찾을 수 없습니다. chuck.mp3와 chu.mp3 파일이 같은 폴더에 있는지 확인하세요.');
                    console.error(e);
                }
            }
        };

        canvasElement.width = 1280;
        canvasElement.height = 720;
    </script>
</body>
</html>
