<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>척추 척척추 샘플러 - 각도 센싱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body { background-color: #050505; color: #E0E0E0; font-family: monospace; overflow: hidden; }
        canvas { transform: scaleX(-1); }
        .status-panel { border: 1px solid #222; background: #0F0F0F; }
    </style>
</head>
<body>

    <div class="flex flex-col h-screen p-2 md:p-4">
        <header class="flex justify-between items-center border-b border-zinc-800 pb-2 mb-2">
            <h1 class="text-lg font-black uppercase tracking-tighter">Spine Sampler <span class="text-xs font-normal text-zinc-500">v3.0</span></h1>
            <button id="startBtn" class="px-4 py-1 text-sm bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded transition-all">ENGINE INIT</button>
        </header>

        <div class="flex-1 grid grid-cols-8 gap-2 min-h-0">
            <div id="leftPad" class="col-span-1 status-panel rounded p-2 flex flex-col justify-center items-center transition-all">
                <span class="text-[9px] text-zinc-500 mb-1 tracking-wider text-center">LEFT</span>
                <h2 class="text-xl font-black text-pink-500">CHK</h2>
            </div>

            <div class="col-span-6 relative bg-black rounded border border-zinc-800 overflow-hidden">
                <video id="input_video" class="hidden"></video>
                <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>
                <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/80 text-cyan-400 font-bold text-sm">카메라 로딩 중...</div>
            </div>

            <div id="rightPad" class="col-span-1 status-panel rounded p-2 flex flex-col justify-center items-center transition-all">
                <span class="text-[9px] text-zinc-500 mb-1 tracking-wider text-center">RIGHT</span>
                <h2 class="text-xl font-black text-cyan-400">CHU</h2>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        
        let audioCtx = null;
        let samples = {};
        let isArmed = { Left: false, Right: false };
        let spineCurve = 0; 

        // 각도 계산 함수
        function getAngle(a, b, c) {
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180 / Math.PI);
            return angle > 180 ? 360 - angle : angle;
        }

        async function loadSample(url) {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        function drawSpine() {
            canvasCtx.beginPath();
            canvasCtx.lineWidth = 10;
            let startX = canvasElement.width / 2;
            let startY = 80;
            let endX = canvasElement.width / 2;
            let endY = 640;
            let controlX = canvasElement.width / 2 + (spineCurve * 250); 
            let controlY = 360;

            canvasCtx.moveTo(startX, startY);
            canvasCtx.quadraticCurveTo(controlX, controlY, endX, endY);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            canvasCtx.stroke();

            for(let t = 0; t <= 1; t += 0.04) {
                let x = (1-t)*(1-t)*startX + 2*(1-t)*t*controlX + t*t*endX;
                let y = (1-t)*(1-t)*startY + 2*(1-t)*t*controlY + t*t*endY;
                canvasCtx.beginPath();
                canvasCtx.ellipse(x, y, 18, 6, 0, 0, 2 * Math.PI);
                canvasCtx.fillStyle = '#E0E0E0';
                canvasCtx.fill();
                canvasCtx.lineWidth = 2;
                // 휘어짐에 따른 색상 반전 (좌: Pink, 우: Cyan)
                canvasCtx.strokeStyle = spineCurve < -0.1 ? '#FF007A' : (spineCurve > 0.1 ? '#00F0FF' : '#444444');
                canvasCtx.stroke();
            }
            spineCurve *= 0.85;
        }

        function playSound(side) {
            if (!audioCtx || !samples[side]) return;
            const source = audioCtx.createBufferSource();
            source.buffer = samples[side];
            source.connect(audioCtx.destination);
            source.start(0);
            // Left(CHK)는 -1.5, Right(CHU)는 1.5
            spineCurve = (side === 'Left') ? -1.5 : 1.5;
        }

        function onResults(results) {
            document.getElementById('loadingOverlay').style.display = 'none';
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            drawSpine();

            if (results.multiHandLandmarks && results.multiHandedness) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const side = results.multiHandedness[index].label === 'Left' ? 'Right' : 'Left';
                    
                    // 각도 계산: 중지(9, 10, 12번 관절 사용)
                    const angle = getAngle(landmarks[9], landmarks[10], landmarks[12]);

                    // 각도가 100도보다 작아지면 굽힘으로 간주(트리거)
                    if (angle < 140) {
                        if (!isArmed[side]) {
                            playSound(side);
                            isArmed[side] = true;
                        }
                    } else {
                        isArmed[side] = false;
                    }

                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: side === 'Left' ? '#FF007A' : '#00F0FF', lineWidth: 1, radius: 3});
                });
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);
        const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 1280, height: 720 });

        startBtn.onclick = async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                samples['Left'] = await loadSample('chuck.mp3');
                samples['Right'] = await loadSample('chu.mp3');
                camera.start();
                startBtn.innerText = 'RUNNING';
            }
        };
    </script>
</body>
</html>
